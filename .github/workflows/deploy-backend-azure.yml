# Uploads the backend folder to an Azure App Service. Started by hand (Actions tab, Run workflow).
# Needs: secret AZURE_WEBAPP_PUBLISH_PROFILE and repository variable AZURE_WEBAPP_NAME. See DEPLOY.md.
# Not tested yet: check it on the first deployment.
name: Deploy backend to Azure
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend
